<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sleek Black & Red Calculator</title>
    <style>
        /* 1. Global Reset & Body Styling */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0a0a0c; /* Deep Dark Background */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            perspective: 1000px;
        }

        /* 2. Calculator Container with Red Neon Glow */
        .calculator {
            background: #121214;
            width: 350px;
            padding: 25px;
            border-radius: 25px;
            border: 1px solid #221114;
            box-shadow: 0 20px 50px rgba(255, 30, 60, 0.15), 
                        inset 0 0 15px rgba(255, 30, 60, 0.05);
            transition: transform 0.3s ease;
        }

        .calculator:hover {
            transform: translateY(-5px);
            box-shadow: 0 25px 60px rgba(255, 30, 60, 0.25);
        }

        /* 3. Sleek Red-Lit Display Screen */
        .display-container {
            position: relative;
            margin-bottom: 25px;
        }

        #display {
            width: 100%;
            height: 80px;
            background-color: #050506;
            border: 1px solid #331115;
            outline: none;
            border-radius: 15px;
            color: #ff3344; /* Neon Red Font */
            font-size: 2.2rem;
            text-align: right;
            padding: 15px 20px;
            font-weight: 600;
            letter-spacing: 1px;
            text-shadow: 0 0 10px rgba(255, 51, 68, 0.5);
            box-shadow: inset 0 2px 10px rgba(0, 0, 0, 0.9);
        }

        /* 4. Buttons Layout Grid */
        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
        }

        /* Standard Button Styling */
        button {
            height: 60px;
            background: #1a1a1e;
            border: 1px solid #28282e;
            outline: none;
            border-radius: 12px;
            color: #ffffff;
            font-size: 1.3rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* Hover & Active Feedback */
        button:hover {
            background: #25252b;
            color: #ff3344;
            border-color: #ff3344;
            box-shadow: 0 0 10px rgba(255, 51, 68, 0.2);
            transform: scale(1.03);
        }

        button:active {
            transform: scale(0.95);
        }

        /* Specific Button Classes for Red Accents */
        .operator {
            color: #ff3344; /* Red color for operators (+, -, *, /) */
            background: #1e1215;
            border-color: #3d141b;
        }

        .operator:hover {
            background: #ff3344;
            color: #ffffff;
            box-shadow: 0 0 15px rgba(255, 51, 68, 0.5);
        }

        /* Clear Button (C) */
        .clear {
            color: #ff9900;
            background: #241910;
            border-color: #4a2f15;
        }

        .clear:hover {
            background: #ff9900;
            color: #121214;
            border-color: #ff9900;
            box-shadow: 0 0 15px rgba(255, 153, 0, 0.4);
        }

        /* Equals Button (=) - Solid Red Highlight */
        .equal {
            background: #ff3344;
            color: #ffffff;
            border: none;
            grid-column: span 2; /* Spans 2 columns */
            box-shadow: 0 4px 15px rgba(255, 51, 68, 0.3);
        }

        .equal:hover {
            background: #e02232;
            color: #ffffff;
            box-shadow: 0 0 20px rgba(255, 51, 68, 0.6);
        }
    </style>
</head>
<body>

    <!-- Main Calculator HTML Structure -->
    <div class="calculator">
        <div class="display-container">
            <input type="text" id="display" readonly placeholder="0">
        </div>
        
        <div class="buttons">
            <!-- Row 1 -->
            <button class="clear" onclick="clearDisplay()">C</button>
            <button class="operator" onclick="appendValue('/')">/</button>
            <button class="operator" onclick="appendValue('*')">*</button>
            <button class="operator" onclick="backspace()">⌫</button>

            <!-- Row 2 -->
            <button onclick="appendValue('7')">7</button>
            <button onclick="appendValue('8')">8</button>
            <button onclick="appendValue('9')">9</button>
            <button class="operator" onclick="appendValue('-')">-</button>

            <!-- Row 3 -->
            <button onclick="appendValue('4')">4</button>
            <button onclick="appendValue('5')">5</button>
            <button onclick="appendValue('6')">6</button>
            <button class="operator" onclick="appendValue('+')">+</button>

            <!-- Row 4 -->
            <button onclick="appendValue('1')">1</button>
            <button onclick="appendValue('2')">2</button>
            <button onclick="appendValue('3')">3</button>
            <button onclick="appendValue('.')">.</button>

            <!-- Row 5 -->
            <button onclick="appendValue('0')">0</button>
            <button onclick="appendValue('00')">00</button>
            <button class="equal" onclick="calculate()">=</button>
        </div>
    </div>

    <!-- Smart & Robust JS Logic -->
    <script>
        const display = document.getElementById('display');

        // Append values to screen
        function appendValue(val) {
            // Prevent multiple initial zeros
            if (display.value === '0' && val !== '.') {
                display.value = val;
            } else {
                display.value += val;
            }
        }

        // Clear Screen
        function clearDisplay() {
            display.value = '';
        }

        // Backspace (Delete single last character)
        function backspace() {
            display.value = display.value.slice(0, -1);
        }

        // Perform calculation safely
        function calculate() {
            try {
                // If display is empty, do nothing
                if (display.value.trim() === '') return;

                // Evaluate expression safely
                const result = eval(display.value);
                
                // Check if result is invalid (e.g. Division by zero)
                if (result === Infinity || isNaN(result)) {
                    display.value = 'Error';
                } else {
                    display.value = result;
                }
            } catch (error) {
                display.value = 'Error';
            }
        }
    </script>
</body>
</html>
